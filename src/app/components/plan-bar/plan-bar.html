<nav class="plan-bar" aria-label="Event">
  <div class="plan-bar-half">
    @if (editing()) {
      <label class="plan-bar-sr" for="plan-bar-name">Event name</label>
      <input
        #field
        id="plan-bar-name"
        class="plan-bar-input"
        type="text"
        [attr.maxlength]="maxLength"
        [value]="draft()"
        (input)="draft.set($any($event.target).value)"
        (keydown.enter)="finishEditing()"
        (keydown.escape)="cancelEditing()"
        (blur)="finishEditing()"
      />
    } @else {
      <button class="plan-bar-name" type="button" title="Rename this event" (click)="startEditing()">
        {{ displayName() }}
      </button>
    }
    <span class="plan-bar-spaced" aria-hidden="true">.. S P A C E !</span>
  </div>

  <a class="plan-bar-half plan-bar-switch" [routerLink]="switchLink()">{{ switchLabel() }}</a>
</nav>
