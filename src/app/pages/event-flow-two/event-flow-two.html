<div class="flow-two-shell">
  <header class="flow-two-header">
    <div>
      <h1 class="flow-two-title">Mission Control</h1>
      <p class="flow-two-subtitle">Manage every detail of your event.</p>
    </div>
    @if (plan()) {
      <button class="btn-danger" type="button" (click)="askDelete()">Delete event</button>
    }
  </header>

  @if (loadError()) {
    <p class="flow-two-error" role="alert">{{ loadError() }}</p>
  } @else if (plan(); as plan) {
    <div class="flow-two-agent">
      <app-agent-chat [eventId]="eventId" (planChange)="this.plan.set($event)" />
      <app-plan-card [plan]="plan" />
    </div>
  }

  <nav class="flow-two-tabs">
    @for (tab of tabs; track tab.path) {
      <a
        class="flow-two-tab"
        [routerLink]="tab.path"
        routerLinkActive="is-active"
      ><img class="icon" [src]="'/icons/' + tab.icon + '.svg'" alt="" /> {{ tab.label }}</a>
    }
  </nav>
  <section class="flow-two-body">
    <router-outlet />
  </section>

  <app-confirm-dialog
    heading="Delete event?"
    [open]="confirmingDelete()"
    [busy]="deleting()"
    [error]="deleteError()"
    (confirm)="confirmDelete()"
    (cancel)="confirmingDelete.set(false)"
  >
    Are you sure you want to delete <strong>{{ plan()?.name ?? 'Untitled event' }}</strong>?
    This can't be undone.
  </app-confirm-dialog>
</div>
