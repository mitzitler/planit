<!-- Supabase → Authentication → Emails → Templates → "Confirm signup".
     Subject: Confirm your Planit account
     Inline styles only: most email clients strip <style> blocks and web fonts. -->
<div style="margin:0;padding:32px 16px;background:#150e52;font-family:Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;margin:0 auto;background:#120a3a;border:1px solid #32206e;border-radius:20px;">
    <tr>
      <td style="padding:40px 32px;text-align:center;">
        <p style="margin:0 0 24px;font-size:22px;font-weight:800;letter-spacing:0.3em;color:#e2e8f0;">PLANIT</p>
        <h1 style="margin:0 0 12px;font-size:20px;font-weight:700;color:#e2e8f0;">Confirm your email</h1>
        <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#8892b0;">
          Thanks for signing up. Confirm this address to start planning your first event.
        </p>
        <a href="{{ .ConfirmationURL }}"
           style="display:inline-block;padding:12px 28px;background:#7c5af5;color:#ffffff;font-size:15px;font-weight:700;text-decoration:none;border-radius:12px;">
          Confirm email
        </a>
        <p style="margin:28px 0 0;font-size:12px;line-height:1.6;color:#8892b0;">
          This link expires in 1 hour. If you didn't sign up for Planit, you can ignore this email.
        </p>
      </td>
    </tr>
  </table>
</div>
